services:
  backend:
    build: ./backend_data_mapper
    container_name: datamapper_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend_data_mapper:/app
      - /app/__pycache__
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./gui_data_mapper
    container_name: datamapper_frontend
    ports:
      - "4321:4321"
    volumes:
      - ./gui_data_mapper:/app
      - /app/node_modules
    environment:
      - HOST=0.0.0.0
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend